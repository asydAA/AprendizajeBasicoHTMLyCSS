<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <div>
            <label for="password">Contraseña:</label>
            <input id="password" type="password" name="password">            
        </div>
        <div>
            <label for="edad">Edad</label>
            <input type="number" name="edad" id="edad" min="18" max="78">
        </div>
        <div>
            <label for="telefono" >Teléfono:</label>
            <input type="tel" name="telefono" id="telefono" title="Ingresa 9 dígitos" placeholder="123456789" pattern="[0-9]{9}">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required placeholder="usuario@ejemplo.com">
        </div>
        <div>
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" min="2026-01-01">
        </div>
        <div>
            <label for="color">Color: </label>
            <input type="color" id="color" name="color">
        </div>
        <fieldset>
            <legend>Género:</legend>
            <input type="radio" name="genero" id="masculino" value="M">
            <label for="masculino">Masculino</label>
            <input type="radio" name="genero" id="femenino" value="F">
            <label for="femenino">Femenino</label>
        </fieldset>

        <fieldset> 
            <legend>Intereses</legend> 
            <input type="checkbox" name="intereses" id="deportes" value="deportes"> 
            <label for="deportes">Deportes</label> 
            <input type="checkbox" name="intereses" id="musica" value="musica"> 
            <label for="musica">Música</label> 
        </fieldset>

        <div> 
            <label for="pais">País</label> 
            <select name="pais" id="pais"> 
                <option value="mexico">México</option> 
                <option value="colombia">Colombia</option> 
                <option value="argentina">Argentina</option> 
                <option value="peru">Perú</option>
                <option value="espana">España</option>
            </select> 
        </div>
        <button type="submit">Enviar</button>
    </form>
    
</body>
</html>
