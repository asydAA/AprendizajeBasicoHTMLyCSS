<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEGUNDA CLASE CSS 2</title>
    <link rel="stylesheet" href="css/colores2.css">
</head>
<body>
    <h1>SELECTORES CSS</h1>
    <p>selector de elemento p</p>
    <div>selector de elemento div</div>
    <p class="rojo">selector de clase .rojo</p>
    <p class="grande">selector de clase .grande</p>
    <p class="rojo grande">Dos clases</p>

    <!-- ID -->
    <p id="nombreUnico">Selector de ID #unico</p>

    <!--DESCENDIENTE-->
    <div class="contenedor">
        <p>Hijo directo</p>
        <div>
            <p>Descendente anidado</p>
        </div>
    </div>

    <!-- PSEUDO CLASES -->
     <button>Hover me</button>
     <a class="rojo" href="#">Link</a>
</body>
</html>
